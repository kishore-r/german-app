<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deutsch 3000 Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .noun { border-left: 8px solid #3b82f6; } 
        .verb { border-left: 8px solid #22c55e; } 
        .adj { border-left: 8px solid #eab308; }  
        .adv { border-left: 8px solid #a855f7; }  
        .hidden-sentence { display: none; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .modal-open { overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>

    <div class="max-w-md mx-auto p-4">

                    <input type="number" id="jump-input" placeholder="1" class="w-10 text-center font-bold text-blue-600 focus:outline-none bg-transparent">
                    <button onclick="jumpToWord()" class="text-blue-600 font-bold text-xs pr-1 hover:scale-110 transition">GO</button>
                </div>
            </div>
            
            <div class="w-full bg-slate-200 rounded-full h-2 mt-4">
                <div id="progress-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <div class="flex justify-between text-[10px] mt-2 font-bold text-slate-400 uppercase tracking-widest">
                <span id="stats-current">Word 1 of 100</span>
                <span id="stats-learned">Learned: 0</span>
            </div>
        </header>

        <!-- Main Card -->
        <div id="main-card" class="bg-white rounded-3xl shadow-xl p-6 mb-4 min-h-[380px] flex flex-col justify-between border border-slate-100 transition-all duration-300">
            <div>
                <div class="flex justify-between items-center mb-4">
                    <span id="type-tag" class="text-[10px] font-bold px-3 py-1 rounded-full uppercase">Type</span>
                    <span id="learned-badge" class="hidden text-[10px] font-bold px-3 py-1 rounded-full bg-green-100 text-green-600 uppercase">✓ Mastered</span>
                </div>
                
                <h2 id="de-word" class="text-4xl font-bold text-slate-800">Laden...</h2>
                <p id="en-word" class="text-xl text-slate-400 mt-1 italic">Loading...</p>

                <div id="sentence-box" class="mt-8 p-4 bg-slate-50 rounded-2xl border border-slate-200">
                    <button onclick="toggleSentence()" id="sent-btn" class="text-[10px] font-bold text-blue-500 uppercase tracking-widest w-full text-left flex justify-between">
                        Example Sentence <span>↓</span>
                    </button>
                    <div id="sentence-content" class="hidden-sentence mt-3">
                        <p id="de-sent" class="text-slate-700 font-medium leading-tight"></p>
                        <p id="en-sent" class="text-slate-400 text-sm italic mt-2"></p>
                    </div>
                </div>
            </div>
            
            <button onclick="toggleLearned()" id="learn-btn" class="w-full mt-6 py-4 rounded-2xl font-bold text-white bg-green-500 hover:bg-green-600 shadow-lg transition-all active:scale-95">
                MARK AS LEARNED
            </button>
        </div>

        <!-- Navigation Controls -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <button onclick="prevWord()" class="bg-white border border-slate-200 text-slate-600 py-4 rounded-2xl font-bold active:bg-slate-100 transition">← BACK</button>
            <button onclick="nextWord()" class="bg-slate-800 text-white py-4 rounded-2xl font-bold shadow-lg active:bg-black transition">NEXT →</button>
        </div>

        <!-- Footer Tools -->
        <div class="space-y-4">
            <div class="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                <button onclick="showLearnedList()" class="text-blue-600 text-[10px] font-black uppercase tracking-widest">📋 Progress List</button>
                <button onclick="shuffleWords()" class="text-slate-400 text-[10px] font-black uppercase tracking-widest">🔀 Shuffle</button>
                <button onclick="resetData()" class="text-red-400 text-[10px] font-black uppercase tracking-widest">🗑️ Reset</button>
            </div>

            <!-- Backup & Restore Section -->
            <div class="bg-slate-200/50 p-4 rounded-2xl border border-dashed border-slate-300">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3 text-center">Data Sync & Backup</p>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="backupProgress()" class="bg-white text-slate-700 border border-slate-300 py-2 rounded-xl text-[10px] font-bold hover:bg-slate-50 transition">💾 EXPORT BACKUP</button>
                    <label class="bg-blue-600 text-white py-2 rounded-xl text-[10px] font-bold text-center cursor-pointer hover:bg-blue-700 transition">
                        📥 IMPORT BACKUP
                        <input type="file" id="importFile" class="hidden" accept=".json" onchange="restoreProgress(event)">
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Learned Words -->
    <div id="list-modal" class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 p-6">
        <div class="bg-white w-full max-w-md mx-auto rounded-3xl h-[80vh] flex flex-col p-6 shadow-2xl mt-10">
            <div class="flex justify-between items-center mb-6">

            <button onclick="closeList()" class="w-full mt-4 bg-slate-800 text-white py-4 rounded-2xl font-bold">CLOSE</button>
        </div>
    </div>

            };
            const c = colors[word.type];
            card.className = "bg-white rounded-3xl shadow-xl p-6 mb-4 min-h-[380px] flex flex-col justify-between border border-slate-100 transition-all " + c[2];
            document.getElementById('type-tag').className = `text-[10px] font-bold px-3 py-1 rounded-full uppercase ${c[0]} ${c[1]}`;
            document.getElementById('type-tag').innerText = c[3];

            const isLearned = learnedList.includes(word.de);
            document.getElementById('learned-badge').classList.toggle('hidden', !isLearned);
            const btn = document.getElementById('learn-btn');
            btn.innerText = isLearned ? "UNMARK LEARNED" : "MARK AS LEARNED";
            btn.className = isLearned ? "w-full mt-6 py-4 rounded-2xl font-bold text-slate-400 bg-slate-100" : "w-full mt-6 py-4 rounded-2xl font-bold text-white bg-green-500 shadow-lg";

            document.getElementById('stats-current').innerText = `Word ${currentIndex + 1} of ${dictionary.length}`;
            document.getElementById('stats-learned').innerText = `Learned: ${learnedList.length}`;
            document.getElementById('progress-bar').style.width = ((currentIndex + 1) / dictionary.length * 100) + "%";

            localStorage.setItem('g_idx', currentIndex);
            localStorage.setItem('g_learned', JSON.stringify(learnedList));
        }

        // NAVIGATION
        function jumpToWord() {
            const val = parseInt(document.getElementById('jump-input').value);
            if (val > 0 && val <= dictionary.length) { currentIndex = val - 1; updateUI(); }
        }
        function nextWord() { if (currentIndex < dictionary.length - 1) { currentIndex++; updateUI(); } }
        function prevWord() { if (currentIndex > 0) { currentIndex--; updateUI(); } }
        
        function toggleSentence() {
            const content = document.getElementById('sentence-content');
            const btn = document.getElementById('sent-btn');
            content.classList.toggle('hidden-sentence');
            btn.innerHTML = content.classList.contains('hidden-sentence') ? "Example Sentence <span>↓</span>" : "Hide Sentence <span>↑</span>";
        }

        function toggleLearned() {
            const wordDe = dictionary[currentIndex].de;
            if(!learnedList.includes(wordDe)) { 
                learnedList.push(wordDe); 
                setTimeout(nextWord, 400); 
            } else { 
                learnedList = learnedList.filter(w => w !== wordDe); 
            }
            updateUI();
        }

        // DATA MANAGEMENT
        function backupProgress() {
            const data = {
                index: currentIndex,
                learned: learnedList,
                timestamp: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `deutsch3000_backup_${new Date().toLocaleDateString()}.json`;
            a.click();
        }

        function restoreProgress(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.learned && Array.isArray(data.learned)) {
                        learnedList = data.learned;
                        currentIndex = data.index || 0;
                        updateUI();
                        alert("Success! Progress restored.");
                    }
                } catch (err) {
                    alert("Invalid backup file.");
                }
            };
            reader.readAsText(file);
        }

        function showLearnedList() {
            const container = document.getElementById('learned-container');
            container.innerHTML = "";
            if (learnedList.length === 0) {
                container.innerHTML = "<p class='text-slate-400 text-center mt-10 uppercase text-[10px] font-black'>Start learning to see progress!</p>";
            } else {
                learnedList.forEach(word => {
                    const div = document.createElement('div');
                    div.className = "flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100 mb-2";
                    div.innerHTML = `<span class="font-bold text-slate-800">${word}</span> <span class="text-green-500 font-bold">✓</span>`;
                    container.appendChild(div);
                });
            }
            document.getElementById('list-modal').classList.remove('hidden');
            document.body.classList.add('modal-open');
        }

        function closeList() {
            document.getElementById('list-modal').classList.add('hidden');
            document.body.classList.remove('modal-open');
        }

        function shuffleWords() {
            if(confirm("Shuffle order? Progress remains safe.")) {
                dictionary.sort(() => Math.random() - 0.5);
                currentIndex = 0;
                updateUI();
            }
        }

        function resetData() { if(confirm("Reset all progress?")) { localStorage.clear(); location.reload(); } }

        updateUI();
    </script>
</body>
</html>
